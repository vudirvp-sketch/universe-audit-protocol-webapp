name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-run from the Actions tab, without pushing an empty commit.
  workflow_dispatch:

# Least privilege: the build job only reads the repository. The deploy job
# additionally gets the Pages scopes it needs below.
permissions:
  contents: read

# One Pages deployment at a time. Queued, not cancelled: two quick pushes must
# not interleave their artifacts, and an in-flight production deploy is never
# killed halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The Pages project site is served under /<repo>/, so the static export
      # has to prefix its asset URLs; pull requests stay at the root.
      NEXT_BASE_PATH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '/universe-audit-protocol-webapp' || '' }}
    steps:
      # Actions are pinned by commit SHA (tags can be moved).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
